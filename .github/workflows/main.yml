name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # අපි මෙතන gradlew කොටස අයින් කරලා, කෙලින්ම build කරන command එක දැම්මා
    - name: Build APK
      run: |
        echo "Building APK directly..."
        # Android SDK එකේ එන gradle command එක භාවිතා කිරීම
        gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/

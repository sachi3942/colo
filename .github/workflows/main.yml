name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # AndroidX ගැටලුව විසඳගන්න gradle.properties එක ඔටෝමැටික්ව හදනවා
    - name: Create gradle.properties
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    # Gradle 9.6.1 එක අයින් කරලා, හරියට වැඩ කරන Gradle 7.6.1 එක පාවිච්චි කිරීම
    - name: Build APK
      run: |
        echo "Building APK with Gradle 7.6.1..."
        wget https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
        unzip -o gradle-7.6.1-bin.zip
        export PATH=$PWD/gradle-7.6.1/bin:$PATH
        
        # Build කිරීම
        gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.colo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.colo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AppCompat (බොහෝ විට ඔබේ කෝඩ් එකේ අනිවාර්යයෙන්ම තියෙන එකක්)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // DeepSeek Java code එකට අදාල JSON හෝ HTTP Libraries (ඔබේ කෝඩ් එකේ භාවිතා කරලා තියෙනවා නම්)
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}
